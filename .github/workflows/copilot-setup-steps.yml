name: "Copilot Setup Steps"

# Validate the setup steps when they change, and allow manual runs from the
# Actions tab. Cargo.lock and Cargo.toml are deliberately excluded: ci.yml
# already runs `cargo check --locked` on every push and pull request, so
# listing them here only duplicates that work on every Renovate PR.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/copilot/settings.json
      - .github/workflows/copilot-setup-steps.yml
      - mise.toml
  pull_request:
    paths:
      - .github/copilot/settings.json
      - .github/workflows/copilot-setup-steps.yml
      - mise.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify Rust language server
        run: mise exec -- rust-analyzer --version
      - name: Warm build and test caches
        run: cargo build --all-targets --all-features
