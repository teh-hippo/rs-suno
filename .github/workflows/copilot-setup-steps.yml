name: "Copilot Setup Steps"

# Validate the setup steps when they change, and allow manual runs from the
# Actions tab. Cargo.lock and Cargo.toml are deliberately excluded: ci.yml
# already runs `cargo check --locked` on every push and pull request, so
# listing them here only duplicates that work on every Renovate PR.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/copilot/settings.json
      - .github/workflows/copilot-setup-steps.yml
      - mise.toml
  pull_request:
    paths:
      - .github/copilot/settings.json
      - .github/workflows/copilot-setup-steps.yml
      - mise.toml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify Rust language server
        run: mise exec -- rust-analyzer --version
      - name: Warm build and test caches
        run: cargo build --all-targets --all-features
