name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@cb3f6e4957f9233f9587728af358a1b2b764229a  # v3.2.19
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
