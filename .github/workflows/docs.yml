name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@d71c5d1def95b72227ef165825d3f6d51affa46b  # v3.2.6
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
