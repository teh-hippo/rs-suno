name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@223df0fbdfb52fc9bbc4e723e06a5ad2077f18f0  # v3.2.21
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
