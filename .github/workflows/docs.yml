name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@5fa0d421729c9ac2c385f7b8248a89db5e4dbddd  # v3.2.31
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
