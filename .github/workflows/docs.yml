name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@942482e4a5c6c04b2cedf484c8cbd7e186365619  # v3.2.34
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
