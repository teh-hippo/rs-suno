name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@4f262c45ec03f02a27a401c73ac7d87ece2da5aa  # v3.2.18
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
