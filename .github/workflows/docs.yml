name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@cdc6cb21f67428d53742baec302ab074f93014e6  # v3.5.19
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
