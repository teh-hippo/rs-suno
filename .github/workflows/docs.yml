name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@3472be29741b4b64888144d58766c9e84dc07b78  # v3.2.0
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
