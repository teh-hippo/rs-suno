name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@2ef31dcb7762991f63ff1feda56b08a013f8fb34  # v3.2.3
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
