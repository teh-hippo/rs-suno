name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@f4be12d62c57181f39424bf4ff8460141ed43649  # v3.2.15
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
