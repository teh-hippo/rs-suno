name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@1ce408bcb79902cdc160a6aa302c3c0c9dc9e594  # v3.5.20
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
