name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@13fb2aefcc3338175d823cf867c841868ff6d4c8  # v3.5.17
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
