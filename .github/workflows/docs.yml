name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@04132673f8dbfe520b09cdc14fc08c83c34ea6bf  # v3.5.15
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
