name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@72e2489476fe188b6728387a839e843bef87c1a9  # v3.2.17
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
