name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@d29dea586d85c4e459e4beffa1ae21b40d12094f  # v3.2.25
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
