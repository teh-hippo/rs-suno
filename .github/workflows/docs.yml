name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@53d1fc8ee012e7fba482104fdb2d779eff892348  # v3.2.14
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
