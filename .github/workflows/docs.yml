name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@b2c7dad9076f0fe25d46d05865ca9f5b2c360947  # v3.2.4
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
