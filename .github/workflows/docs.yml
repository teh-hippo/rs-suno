name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@74d034769502f1c91c91c58b524ac912733e5c98  # v3.2.5
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
