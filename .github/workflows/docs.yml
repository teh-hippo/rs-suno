name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@d18e923cbd49d67099fabe46a9dca9cad17c3223  # v3.2.24
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
