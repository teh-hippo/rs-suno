name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@818b20188987583b2dfefb1c04f9c898fa8f0d87  # v3.2.16
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
