name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@ce951a05c44777e6336bf5735f740c915251e141  # v3.2.8
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
