name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@a511f54718e6710945af5ee1509ed8408636b6bb  # v3.2.12
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
