name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@0cefd797b02a13469434b002d89a787487349670  # v3.2.22
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
