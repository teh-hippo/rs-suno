name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@273586e2942b6a33b4c4c82754d33b738ee00a7e  # v3.2.23
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
