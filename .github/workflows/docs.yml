name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@5928973d0de2de7076a3e0d2f32c14556e0c436e  # v3.2.27
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
