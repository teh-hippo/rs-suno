name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@480653c2278884104b02bb6f1f5d7ec82842d572  # v3.2.30
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
