name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@4eeacfebd2bac88d3f9cb1bffb6e1f86d6bc008d  # v3.5.13
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
