name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@be8902b405b3302103da109a66c29d539800289d  # v3.2.9
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
