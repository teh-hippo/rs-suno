name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@52305ee7afe0528969eb59110bc876ac7092669b  # v3.2.11
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
