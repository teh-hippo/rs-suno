name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@f9387d1201e2c7e31ccdd7a1a04152f2f31ac557  # v3.2.26
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
