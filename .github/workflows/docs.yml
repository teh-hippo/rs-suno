name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@132e34daece974042b5b14aa69599c1c911b787b  # v3.2.28
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
