name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@5186f7fdfe9036a0a6d69c7f3a673f639dc9534d  # v3.2.32
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
