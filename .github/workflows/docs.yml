name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@4ca742eda76e2a05421784306ae95f5f36958b4d  # v3.2.13
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
