name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@2b812790ff0a2cec9bd31eeae1f62876485746b3  # v3.2.7
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
