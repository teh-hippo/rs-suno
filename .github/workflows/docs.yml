name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@066eefc9351dc792c477eee3fcfc6231cd0a4c17  # v3.2.29
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
