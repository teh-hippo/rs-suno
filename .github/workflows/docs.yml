name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@a5ad467f2589e41475a5859f6bd4e7dd027d8a63  # v3.2.20
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
