name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    uses: teh-hippo/common-repo-configs/.github/workflows/mdbook.yml@b5107940ef8e5d69e80ecf781b7493aa808d8b19  # v3.5.18
    permissions:
      pages: write
      id-token: write
      contents: read
    with:
      path: docs
