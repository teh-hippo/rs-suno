# macOS verification (build and test only). The project is OS-agnostic and the
# Linux and Windows legs gate every pull request, but Darwin had no CI evidence
# at all, so a macOS-only regression could only surface in a user's install.
#
# This runs weekly rather than per pull request. The suite is deterministic, with
# no network or disk dependency, so a macOS-only break is far more likely to
# arrive with a toolchain or dependency update than with a given change; a weekly
# run catches that without adding macOS runner minutes, which bill at a premium
# multiplier, to every pull request. workflow_dispatch is kept for checking a
# suspect change on demand.
#
# The cron is offset from supply-chain.yml's Monday 06:23 slot so the two do not
# contend for runners.
name: macOS

on:
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  macos-check:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true
      - run: cargo test --workspace --all-features
