name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@4eeacfebd2bac88d3f9cb1bffb6e1f86d6bc008d  # v3.5.13
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
