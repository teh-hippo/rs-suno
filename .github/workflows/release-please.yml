name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    uses: teh-hippo/common-repo-configs/.github/workflows/release-please.yml@223df0fbdfb52fc9bbc4e723e06a5ad2077f18f0  # v3.2.21
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
