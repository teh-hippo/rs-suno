name: Release

# A tag push runs the whole pipeline: binaries and crates.io, then the container.
#
# The container leg depends on Docker Hub (it cosign-verifies the buildkit,
# syft-scanner and binfmt images), so a registry outage can fail it alone and
# leave a release with binaries published but no image — the tags meta-action
# also owns `latest`, so `latest` then stays on the previous version. The
# workflow_dispatch trigger below republishes the container for an already
# released tag without re-attempting the binary and crates.io legs, which are
# not idempotent.
#
#   gh workflow run release.yml --ref vX.Y.Z
#
# Caveat: workflow_dispatch resolves this file from the ref it is dispatched
# against, so a tag cut before this trigger existed cannot be dispatched. Fall
# back to re-running the original run's failed jobs
# (`gh run rerun <run-id> --failed`) for those.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Tag push only: re-publishing binaries and crates.io for an existing
    # version is not idempotent, so a dispatch skips straight to the container.
    if: ${{ github.event_name == 'push' }}
    uses: teh-hippo/common-repo-configs/.github/workflows/rust-release.yml@52305ee7afe0528969eb59110bc876ac7092669b  # v3.2.11
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary-name: suno
      publish-crates: '["suno-core","rs-suno"]'
      targets: '[{"target":"x86_64-unknown-linux-musl","os":"ubuntu-24.04","build-tool":"cargo","label":"x86_64-linux"},{"target":"aarch64-unknown-linux-musl","os":"ubuntu-24.04","build-tool":"cross","label":"aarch64-linux"},{"target":"x86_64-pc-windows-msvc","os":"windows-latest","build-tool":"cargo","label":"x86_64-windows","rustflags":"-C target-feature=+crt-static"},{"target":"aarch64-pc-windows-msvc","os":"windows-11-arm","build-tool":"cargo","label":"aarch64-windows","rustflags":"-C target-feature=+crt-static"}]'

  container:
    needs: release
    # `needs` alone would skip this leg whenever `release` is skipped, which is
    # exactly the dispatch case, so state the condition explicitly: run unless
    # the release leg actually failed.
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      job-name-prefix: container
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      sbom: true
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=ref,event=tag
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
      labels: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.description=A download-only command-line tool for mirroring a Suno library.
        org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later AND LGPL-2.1-or-later
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ github.ref_name }}
        org.opencontainers.image.title=rs-suno
        org.opencontainers.image.url=https://github.com/${{ github.repository }}
      annotations: |
        org.opencontainers.image.source=https://github.com/${{ github.repository }}
        org.opencontainers.image.description=A download-only command-line tool for mirroring a Suno library.
        org.opencontainers.image.licenses=MIT AND GPL-2.0-or-later AND LGPL-2.1-or-later
        org.opencontainers.image.revision=${{ github.sha }}
        org.opencontainers.image.version=${{ github.ref_name }}
        org.opencontainers.image.title=rs-suno
        org.opencontainers.image.url=https://github.com/${{ github.repository }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  container-verify:
    needs: container
    uses: docker/github-builder/.github/workflows/verify.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1
    permissions:
      contents: read
      packages: read
    with:
      builder-outputs: ${{ toJSON(needs.container.outputs) }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
